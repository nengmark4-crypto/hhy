<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:sans-serif;background:#111827;color:#fff;padding:20px;text-align:center}
input,select{width:100%;padding:14px;border-radius:12px;border:0;margin:10px 0;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-size:17px;font-weight:800}
#status{margin-top:15px;color:#a78bfa}
</style>
</head>
<body>
<h2>حمّل فيديو او صوت</h2>
<input id="url" placeholder="الصق لينك الفيديو هنا...">
<select id="format">
  <option value="video">فيديو MP4</option>
  <option value="audio">صوت MP3</option>
</select>
<button onclick="start()">ابعتلي الملف</button>
<div id="status"></div>
<script src="app.js"></script>
</body>
</html>
